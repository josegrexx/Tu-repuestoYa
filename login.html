<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Tiendas - TurespuestoYa</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4 font-sans">

    <div class="max-w-md w-full bg-slate-800/80 backdrop-blur-md border border-slate-700 p-8 rounded-2xl shadow-2xl flex flex-col gap-6">
        
        <!-- Cabecera -->
        <div class="text-center">
            <h1 class="text-2xl font-black text-amber-500">TurespuestoYa 🚗💨</h1>
            <p class="text-xs text-slate-400 mt-1">Portal exclusivo para gestión de tiendas y repuestos.</p>
        </div>

        <!-- Formulario de Acceso -->
        <div class="flex flex-col gap-4">
            <div>
                <label class="text-xs text-slate-400 font-bold mb-1 block">Correo Electrónico</label>
                <input type="email" id="email" placeholder="tutienda@gmail.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:border-amber-500 focus:outline-none transition text-sm">
            </div>

            <div>
                <label class="text-xs text-slate-400 font-bold mb-1 block">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:border-amber-500 focus:outline-none transition text-sm">
            </div>

            <button id="btnLogin" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3.5 rounded-xl transition shadow-lg shadow-amber-500/20 text-sm mt-2">
                Entrar al Panel
            </button>
        </div>

        <div class="text-center border-t border-slate-700 pt-4">
            <a href="index.html" class="text-xs text-amber-400 hover:underline font-semibold">← Volver al Catálogo Público</a>
        </div>
    </div>

    <!-- Script de Firebase y Lógica de Autenticación -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4xzcn6XKdViHsdGnGJukyqcdAOKWtujg",
            authDomain: "turepuestoya.firebaseapp.com",
            projectId: "turepuestoya",
            databaseURL: "https://turepuestoya-default-rtdb.firebaseio.com",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('btnLogin').addEventListener('click', () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                return alert("Por favor completa tu correo y contraseña.");
            }

            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    window.location.href = "panel.html";
                })
                .catch((error) => {
                    alert("Error al iniciar sesión: Verifique sus credenciales.");
                });
        });
    </script>
</body>
</html>
