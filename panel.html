<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda - TurespuestoYa</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans hidden" id="bodyApp">

    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div>
                <span class="text-xl font-black text-amber-500" id="nombreTiendaHeader">Mi Tienda</span>
                <div class="text-xs text-slate-400 mt-1">Vendedor: <span id="userEmail" class="font-bold text-white">...</span></div>
            </div>
            <div class="flex gap-2">
                <a href="index.html" class="bg-slate-700 hover:bg-slate-600 font-bold px-4 py-2 rounded-lg text-xs transition">Ver Catálogo</a>
                <button id="btnLogout" class="bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white font-bold px-4 py-2 rounded-lg text-xs transition">Cerrar Sesión</button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 flex-grow w-full grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
        
        <!-- Formulario de Inventario -->
        <section class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl flex flex-col gap-4">
            <h2 class="text-xl font-bold text-slate-100 flex items-center gap-2">📦 Agregar al Inventario</h2>
            <input type="text" id="prodNombre" placeholder="Nombre (Ej. Base de amortiguador)" class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:border-amber-500 focus:outline-none">
            <div class="grid grid-cols-2 gap-4">
                <input type="number" id="prodPrecio" placeholder="Precio ($)" class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:border-amber-500 focus:outline-none">
                <select id="prodCat" class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:border-amber-500 focus:outline-none">
                    <option value="" disabled selected>Categoría...</option>
                    <option value="Motor">Motor</option>
                    <option value="Frenos">Frenos</option>
                    <option value="Suspensión">Suspensión</option>
                    <option value="Eléctrico">Eléctrico</option>
                    <option value="Carrocería">Carrocería</option>
                    <option value="Accesorios">Accesorios</option>
                </select>
            </div>
            <button id="btnAddProduct" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 rounded-xl transition shadow-lg mt-2">Publicar Repuesto</button>
        </section>

        <!-- Pedidos de esta tienda -->
        <section class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl flex flex-col gap-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                <h2 class="text-xl font-bold text-slate-100">🔔 Pedidos Entrantes</h2>
                <span class="flex h-3 w-3 relative">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
            </div>
            
            <div id="pedidosList" class="flex flex-col gap-4 overflow-y-auto max-h-[500px] pr-1">
                <p class="text-slate-400 text-sm italic">Esperando pedidos nuevos...</p>
            </div>
        </section>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue, remove, get } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4xzcn6XKdViHsdGnGJukyqcdAOKWtujg",
            authDomain: "turepuestoya.firebaseapp.com",
            projectId: "turepuestoya",
            databaseURL: "https://turepuestoya-default-rtdb.firebaseio.com",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        let miUid = null;
        let nombreTiendaOficial = "";

        // Proteger panel y VERIFICAR TOKEN
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                miUid = user.uid;
                
                // Verificar si esta cuenta fue autorizada con Token
                const tiendaSnap = await get(ref(db, `tiendasAutorizadas/${miUid}`));
                if (!tiendaSnap.exists()) {
                    alert("Acceso denegado: Tu cuenta no está registrada como tienda. Pídele un Token de Activación al Administrador.");
                    window.location.href = "index.html";
                    return;
                }

                nombreTiendaOficial = tiendaSnap.val().nombreTienda;
                document.getElementById('nombreTiendaHeader').innerText = nombreTiendaOficial;
                document.getElementById('userEmail').innerText = user.email;
                document.getElementById('bodyApp').classList.remove('hidden');
                escucharPedidos();
            } else {
                window.location.href = "login.html";
            }
        });

        document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));

        // Publicar Producto con el nombre de la Tienda
        document.getElementById('btnAddProduct').addEventListener('click', () => {
            const nom = document.getElementById('prodNombre').value.trim();
            const pre = parseFloat(document.getElementById('prodPrecio').value);
            const cat = document.getElementById('prodCat').value;

            if(!nom || !pre || !cat) return alert("Llena nombre, precio y selecciona una categoría.");

            push(ref(db, `inventarios/${miUid}`), {
                nombre: nom, 
                precio: pre, 
                categoria: cat, 
                tiendaId: miUid,
                nombreTienda: nombreTiendaOficial
            }).then(() => {
                alert("¡Repuesto publicado en el catálogo!");
                document.getElementById('prodNombre').value = "";
                document.getElementById('prodPrecio').value = "";
                document.getElementById('prodCat').value = "";
            });
        });

        function escucharPedidos() {
            onValue(ref(db, `pedidos/${miUid}`), (snapshot) => {
                const list = document.getElementById('pedidosList');
                list.innerHTML = "";
                const datos = snapshot.val();
                if (!datos) { 
                    list.innerHTML = `<p class="text-slate-400 text-sm text-center py-10">Sin pedidos por los momentos.</p>`; 
                    return; 
                }

                Object.entries(datos).reverse().forEach(([id, ped]) => {
                    list.innerHTML += `
                        <div class="bg-slate-900 border border-slate-700 p-4 rounded-xl shadow-md">
                            <div class="flex justify-between items-start mb-2">
                                <strong class="text-amber-400 text-lg leading-tight">${ped.repuesto}</strong>
                                <span class="text-emerald-400 font-black text-xl">$${ped.precio}</span>
                            </div>
                            
                            <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 text-sm mt-3 space-y-2">
                                <div><span class="text-slate-400">👤 Cliente:</span> <span class="font-bold text-white">${ped.cliente}</span></div>
                                <div><span class="text-slate-400">📞 Teléfono:</span> <span class="text-blue-400 font-bold">${ped.telefono}</span></div>
                                <div><span class="text-slate-400">📍 Entrega:</span> <span class="text-slate-200">${ped.direccion}</span></div>
                            </div>
                            
                            <div class="mt-4 flex justify-end">
                                <button onclick="despachar('${id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-xl transition w-full sm:w-auto">
                                    Marcar como Entregado ✓
                                </button>
                            </div>
                        </div>`;
                });
            });
        }

        window.despachar = function(id) {
            if(confirm("¿Seguro que ya entregaste este repuesto?")) {
                remove(ref(db, `pedidos/${miUid}/${id}`));
            }
        };
    </script>
</body>
</html>
