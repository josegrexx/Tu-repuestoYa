<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Tienda - TurespuestoYa</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Encabezado del Panel -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-black text-amber-500">Panel de Mi Tienda ⚙️</h1>
                <div class="text-xs text-slate-400 mt-0.5">Tienda conectada: <span id="userEmail" class="font-bold text-white">Cargando...</span></div>
            </div>
            <div class="flex gap-2">
                <a href="index.html" target="_blank" class="bg-slate-700 hover:bg-slate-600 text-white font-bold px-4 py-2 rounded-xl text-xs transition border border-slate-600">Ver Catálogo Público ↗</a>
                <button id="btnLogout" class="bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white font-bold px-4 py-2 rounded-xl text-xs transition border border-red-500/20">Cerrar Sesión</button>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-6xl mx-auto p-4 flex-grow w-full grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
        
        <!-- Formulario para Publicar Repuestos -->
        <section class="bg-slate-800/80 backdrop-blur-md border border-slate-700 p-6 rounded-2xl shadow-xl flex flex-col gap-4">
            <h2 class="text-xl font-bold text-slate-100 flex items-center gap-2">📦 Publicar Nuevo Repuesto</h2>
            <p class="text-xs text-slate-400">Los repuestos que publiques aquí se reflejarán automáticamente en tiempo real en la página principal.</p>
            
            <div class="flex flex-col gap-3 mt-2">
                <div>
                    <label class="text-xs text-slate-400 font-bold mb-1 block">Nombre del Repuesto</label>
                    <input type="text" id="prodNombre" placeholder="Ej. Amortiguador Del delantero / Kit de Embrague" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:border-amber-500 focus:outline-none transition">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-slate-400 font-bold mb-1 block">Precio ($)</label>
                        <input type="number" step="0.01" id="prodPrecio" placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:border-amber-500 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 font-bold mb-1 block">Categoría</label>
                        <select id="prodCat" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:border-amber-500 focus:outline-none transition">
                            <option value="" disabled selected>Selecciona...</option>
                            <option value="Motor">Motor</option>
                            <option value="Frenos">Frenos</option>
                            <option value="Suspensión">Suspensión</option>
                            <option value="Eléctrico">Eléctrico</option>
                            <option value="Carrocería">Carrocería</option>
                            <option value="Accesorios">Accesorios</option>
                        </select>
                    </div>
                </div>
            </div>

            <button id="btnAddProduct" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3.5 rounded-xl transition shadow-lg shadow-amber-500/20 mt-2">Publicar en el Catálogo</button>
        </section>

        <!-- Lista de Repuestos Propios Publicados -->
        <section class="bg-slate-800/80 backdrop-blur-md border border-slate-700 p-6 rounded-2xl shadow-xl flex flex-col gap-4">
            <h2 class="text-xl font-bold text-slate-100">📋 Mis Repuestos en Stock</h2>
            
            <div id="myProductsList" class="flex flex-col gap-3 overflow-y-auto max-h-[420px] pr-1">
                <p class="text-slate-500 text-sm italic text-center py-12">Cargando tu inventario...</p>
            </div>
        </section>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4xzcn6XKdViHsdGnGJukyqcdAOKWtujg",
            authDomain: "turepuestoya.firebaseapp.com",
            projectId: "turepuestoya",
            databaseURL: "https://turepuestoya-default-rtdb.firebaseio.com",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        
        let currentUserUid = null;
        let currentUserEmail = "";

        // Validar sesión activa (si no ha iniciado sesión, se devuelve al login)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserUid = user.uid;
                currentUserEmail = user.email;
                document.getElementById('userEmail').innerText = currentUserEmail;
                cargarMisRepuestos(currentUserUid);
            } else {
                window.location.href = "login.html";
            }
        });

        // Botón Cerrar Sesión
        document.getElementById('btnLogout').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            });
        });

        // Lógica para Publicar Repuesto
        document.getElementById('btnAddProduct').addEventListener('click', () => {
            const nombre = document.getElementById('prodNombre').value.trim();
            const precio = parseFloat(document.getElementById('prodPrecio').value);
            const categoria = document.getElementById('prodCat').value;

            if (!nombre || isNaN(precio) || !categoria) {
                return alert("Por favor completa todos los campos (nombre, precio y categoría).");
            }

            // Nombre comercial amigable sacado del correo de la tienda (ej: repuestosvalencia@gmail.com -> repuestosvalencia)
            const nombreTiendaLimpio = currentUserEmail.split('@')[0];

            // Guardar en la base de datos bajo la ruta exacta que escucha el index: inventarios / [uid_tienda]
            push(ref(db, `inventarios/${currentUserUid}`), {
                nombre: nombre,
                precio: precio,
                categoria: categoria,
                nombreTienda: nombreTiendaLimpio
            }).then(() => {
                alert("¡Repuesto publicado con éxito y sincronizado en el catálogo!");
                document.getElementById('prodNombre').value = "";
                document.getElementById('prodPrecio').value = "";
                document.getElementById('prodCat').value = "";
            }).catch((error) => {
                alert("Error al publicar: " + error.message);
            });
        });

        // Cargar y mostrar los repuestos propios de la tienda en tiempo real
        function cargarMisRepuestos(uid) {
            onValue(ref(db, `inventarios/${uid}`), (snapshot) => {
                const listContainer = document.getElementById('myProductsList');
                listContainer.innerHTML = "";
                const data = snapshot.val();

                if (!data) {
                    listContainer.innerHTML = `<p class="text-slate-500 text-sm italic text-center py-12">Aún no has publicado ningún repuesto en tu stock.</p>`;
                    return;
                }

                Object.entries(data).reverse().forEach(([prodId, prod]) => {
                    listContainer.innerHTML += `
                        <div class="bg-slate-900 border border-slate-700/80 p-4 rounded-xl flex justify-between items-center gap-3 shadow-sm">
                            <div>
                                <span class="bg-slate-800 border border-slate-700 text-amber-400 text-[10px] font-bold px-2.5 py-0.5 rounded-md">
                                    ${prod.categoria}
                                </span>
                                <h3 class="font-bold text-white text-base mt-1 leading-snug">${prod.nombre}</h3>
                                <span class="text-emerald-400 font-black text-sm">$${prod.precio}</span>
                            </div>
                            <button onclick="eliminarRepuesto('${prodId}')" class="bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white border border-red-500/20 text-xs font-bold px-3 py-2 rounded-xl transition shrink-0">
                                Eliminar
                            </button>
                        </div>`;
                });
            });
        }

        // Función global para eliminar un repuesto del stock (se borra automáticamente del index también)
        window.eliminarRepuesto = function(prodId) {
            if (confirm("¿Estás seguro de que deseas eliminar este repuesto de tu tienda?")) {
                remove(ref(db, `inventarios/${currentUserUid}/${prodId}`))
                    .catch((error) => {
                        alert("No se pudo eliminar: " + error.message);
                    });
            }
        };
    </script>
</body>
</html>
