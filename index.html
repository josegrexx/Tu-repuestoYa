<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - TurespuestoYa</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Encabezado Público -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-black text-amber-500">TurespuestoYa 🚗💨</h1>
                <p class="text-xs text-slate-400">Encuentra repuestos disponibles en las tiendas en tiempo real.</p>
            </div>
            <div class="flex items-center gap-3">
                <a href="login.html" class="bg-slate-700 hover:bg-slate-600 text-amber-400 font-bold px-4 py-2 rounded-xl text-xs transition border border-slate-600">Acceso Tiendas (Panel) ⚙️</a>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto p-4 flex-grow w-full flex flex-col gap-6 mt-2">
        
        <!-- Barra de Búsqueda, Filtros y Ubicación -->
        <section class="bg-slate-800/80 backdrop-blur-md border border-slate-700 p-4 rounded-2xl shadow-xl flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="w-full md:w-2/5">
                <input type="text" id="inputBuscar" placeholder="🔍 Buscar repuesto por nombre..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:border-amber-500 focus:outline-none transition text-sm">
            </div>
            <div class="w-full md:w-1/4">
                <select id="selectUbicacion" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:border-amber-500 focus:outline-none transition text-sm">
                    <option value="">📍 Todas las Ciudades</option>
                    <option value="San Cristóbal">San Cristóbal</option>
                    <option value="Maracay">Maracay</option>
                    <option value="Caracas">Caracas</option>
                    <option value="Valencia">Valencia</option>
                    <option value="Barquisimeto">Barquisimeto</option>
                    <option value="Maracaibo">Maracaibo</option>
                    <option value="Puerto La Cruz">Puerto La Cruz</option>
                    <option value="Mérida">Mérida</option>
                </select>
            </div>
            <div class="w-full md:w-1/4">
                <select id="selectCategoria" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:border-amber-500 focus:outline-none transition text-sm">
                    <option value="">📦 Todas las Categorías</option>
                    <option value="Motor">Motor</option>
                    <option value="Frenos">Frenos</option>
                    <option value="Suspensión">Suspensión</option>
                    <option value="Eléctrico">Eléctrico</option>
                    <option value="Carrocería">Carrocería</option>
                    <option value="Accesorios">Accesorios</option>
                </select>
            </div>
        </section>

        <!-- Cuadrícula de Catálogo Público -->
        <section>
            <h2 class="text-lg font-bold text-slate-100 mb-4 flex items-center gap-2">🛒 Repuestos Disponibles en Venezuela</h2>
            <div id="catalogoPublico" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <p class="text-slate-500 text-sm italic text-center col-span-full py-12">Cargando catálogo en tiempo real...</p>
            </div>
        </section>

    </main>

    <!-- Modal para Solicitar Pedido -->
    <div id="modalPedido" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden justify-center items-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-md w-full flex flex-col gap-4 shadow-2xl">
            <h3 class="text-xl font-black text-amber-500">🛒 Solicitar Repuesto</h3>
            <p class="text-xs text-slate-400">Ingresa tus datos para enviar el pedido y contactar a la tienda por WhatsApp.</p>
            
            <div id="infoRepuestoModal" class="bg-slate-950 border border-slate-800 p-3 rounded-xl text-xs text-slate-300">
                <!-- Se llena dinámicamente -->
            </div>

            <div class="flex flex-col gap-3 mt-1">
                <div>
                    <label class="text-xs text-slate-400 font-bold mb-1 block">Tu Nombre / Apellido</label>
                    <input type="text" id="clienteNombre" placeholder="Ej. Carlos Pérez" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 focus:border-amber-500 focus:outline-none text-xs">
                </div>
                <div>
                    <label class="text-xs text-slate-400 font-bold mb-1 block">Teléfono de Contacto</label>
                    <input type="text" id="clienteTelefono" placeholder="Ej. 04141234567" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 focus:border-amber-500 focus:outline-none text-xs">
                </div>
                <div>
                    <label class="text-xs text-slate-400 font-bold mb-1 block">Dirección de Entrega / Referencia</label>
                    <textarea id="clienteDireccion" rows="2" placeholder="Ej. San Cristóbal, Barrio Obrero..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 focus:border-amber-500 focus:outline-none text-xs resize-none"></textarea>
                </div>
            </div>

            <div class="flex gap-2 mt-2">
                <button id="btnEnviarPedido" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl transition flex-1 text-xs">Enviar Pedido a WhatsApp 📱</button>
                <button onclick="cerrarModalPedido()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 px-4 rounded-xl transition text-xs">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Script de Firebase y Lógica Pública -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4xzcn6XKdViHsdGnGJukyqcdAOKWtujg",
            authDomain: "turepuestoya.firebaseapp.com",
            projectId: "turepuestoya",
            databaseURL: "https://turepuestoya-default-rtdb.firebaseio.com",
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let globalInventarioCache = {};
        let tiendasInfoCache = {};
        let pedidoActualData = null;

        function cargarCatalogo() {
            onValue(ref(db, 'tiendas'), (snapshotTiendas) => {
                tiendasInfoCache = snapshotTiendas.val() || {};

                onValue(ref(db, 'inventarios'), (snapshot) => {
                    const contenedor = document.getElementById('catalogoPublico');
                    contenedor.innerHTML = "";
                    globalInventarioCache = {};
                    const data = snapshot.val();

                    if (!data) {
                        contenedor.innerHTML = `<p class="text-slate-500 text-sm italic text-center col-span-full py-12">No hay repuestos publicados en este momento.</p>`;
                        return;
                    }

                    let hayProductos = false;

                    Object.entries(data).forEach(([storeUid, productosTienda]) => {
                        const infoTienda = tiendasInfoCache[storeUid] || {};
                        
                        if (infoTienda.estado === 'pausada') return;

                        const nombreTiendaBase = infoTienda.nombreTienda || 'TIENDA OFICIAL';
                        const nombreTiendaMayus = nombreTiendaBase.toUpperCase();
                        const ciudadTienda = infoTienda.ciudad || 'San Cristóbal';
                        const telefonoTienda = infoTienda.whatsapp || infoTienda.telefono || "";

                        if (productosTienda) {
                            Object.entries(productosTienda).forEach(([prodId, prod]) => {
                                const stockDisponible = prod.stock !== undefined ? prod.stock : 0;
                                
                                if (stockDisponible > 0) {
                                    hayProductos = true;
                                    globalInventarioCache[prodId] = { 
                                        storeUid, 
                                        ...prod, 
                                        nombreTienda: nombreTiendaMayus,
                                        ciudadTienda: ciudadTienda,
                                        telefonoTienda: telefonoTienda
                                    };
                                }
                            });
                        }
                    });

                    if (!hayProductos) {
                        contenedor.innerHTML = `<p class="text-slate-500 text-sm italic text-center col-span-full py-12">No hay repuestos disponibles en este momento (todos agotados).</p>`;
                        return;
                    }

                    renderizarTarjetas();
                });
            });
        }

        function renderizarTarjetas() {
            const contenedor = document.getElementById('catalogoPublico');
            const filtroTexto = document.getElementById('inputBuscar').value.toLowerCase().trim();
            const filtroUbicacion = document.getElementById('selectUbicacion').value;
            const filtroCat = document.getElementById('selectCategoria').value;

            contenedor.innerHTML = "";
            let contadorResultados = 0;

            Object.entries(globalInventarioCache).forEach(([prodId, prod]) => {
                const nombreMatch = prod.nombre.toLowerCase().includes(filtroTexto);
                const ubicacionMatch = !filtroUbicacion || prod.ciudadTienda === filtroUbicacion;
                const catMatch = !filtroCat || prod.categoria === filtroCat;

                if (nombreMatch && ubicacionMatch && catMatch) {
                    contadorResultados++;
                    const stockDisponible = prod.stock !== undefined ? prod.stock : 0;

                    contenedor.innerHTML += `
                        <div class="bg-slate-800/80 backdrop-blur-md border border-slate-700/80 p-5 rounded-2xl flex flex-col justify-between gap-4 shadow-xl">
                            <div class="flex flex-col gap-2.5">
                                <div class="bg-amber-500/15 border-2 border-amber-500/40 px-3.5 py-2.5 rounded-xl flex flex-col gap-1 shadow-inner">
                                    <div class="flex justify-between items-center">
                                        <span class="text-[9px] uppercase tracking-wider text-amber-400 font-black">🏢 Tienda Asociada:</span>
                                        <span class="text-[10px] bg-slate-900 text-sky-400 font-bold px-2 py-0.5 rounded-md border border-slate-700">📍 ${prod.ciudadTienda}</span>
                                    </div>
                                    <span class="text-base text-amber-300 font-black tracking-wide leading-tight">${prod.nombreTienda}</span>
                                </div>
                                <div class="flex justify-between items-center mt-0.5">
                                    <span class="bg-slate-900 border border-slate-700 text-slate-300 text-[10px] font-bold px-2.5 py-0.5 rounded-md">
                                        ${prod.categoria}
                                    </span>
                                    <span class="text-xs font-semibold text-slate-400">Stock: ${stockDisponible}</span>
                                </div>
                                <h3 class="font-bold text-white text-base leading-snug mt-0.5">${prod.nombre}</h3>
                            </div>
                            <div class="flex justify-between items-center pt-3 border-t border-slate-700/60">
                                <span class="text-emerald-400 font-black text-lg">$${prod.precio}</span>
                                <button onclick="abrirModalPedido('${prodId}')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3.5 py-2 rounded-xl text-xs transition shadow-md shadow-amber-500/10">Pedir Repuesto</button>
                            </div>
                        </div>`;
                }
            });

            if (contadorResultados === 0) {
                contenedor.innerHTML = `<p class="text-slate-500 text-sm italic text-center col-span-full py-12">No se encontraron repuestos con esos criterios en esta ciudad.</p>`;
            }
        }

        document.getElementById('inputBuscar').addEventListener('input', renderizarTarjetas);
        document.getElementById('selectUbicacion').addEventListener('change', renderizarTarjetas);
        document.getElementById('selectCategoria').addEventListener('change', renderizarTarjetas);

        window.abrirModalPedido = function(prodId) {
            const prod = globalInventarioCache[prodId];
            if (!prod) return;

            pedidoActualData = {
                storeUid: prod.storeUid,
                repuesto: prod.nombre,
                precio: prod.precio,
                nombreTienda: prod.nombreTienda,
                telefonoTienda: prod.telefonoTienda
            };

            document.getElementById('infoRepuestoModal').innerHTML = `
                <p><strong>Tienda:</strong> <span class="text-amber-400 font-bold text-sm">${prod.nombreTienda} (${prod.ciudadTienda})</span></p>
                <p class="mt-1"><strong>Repuesto:</strong> <span class="text-white font-bold">${prod.nombre}</span></p>
                <p><strong>Precio:</strong> <span class="text-emerald-400 font-bold">$${prod.precio}</span></p>
            `;

            document.getElementById('modalPedido').classList.remove('hidden');
            document.getElementById('modalPedido').classList.add('flex');
        };

        window.cerrarModalPedido = function() {
            document.getElementById('modalPedido').classList.add('hidden');
            document.getElementById('modalPedido').classList.remove('flex');
            document.getElementById('clienteNombre').value = "";
            document.getElementById('clienteTelefono').value = "";
            document.getElementById('clienteDireccion').value = "";
            pedidoActualData = null;
        };

        document.getElementById('btnEnviarPedido').addEventListener('click', () => {
            const cliente = document.getElementById('clienteNombre').value.trim();
            const telefono = document.getElementById('clienteTelefono').value.trim();
            const direccion = document.getElementById('clienteDireccion').value.trim();

            if (!cliente || !telefono || !direccion) {
                return alert("Por favor completa todos los campos (nombre, teléfono y dirección).");
            }

            if (!pedidoActualData) return;

            const fechaActual = new Date().toLocaleString();

            push(ref(db, `pedidos/${pedidoActualData.storeUid}`), {
                repuesto: pedidoActualData.repuesto,
                precio: pedidoActualData.precio,
                cliente: cliente,
                telefono: telefono,
                direccion: direccion,
                fecha: fechaActual
            }).then(() => {
                let wspTienda = pedidoActualData.telefonoTienda;
                wspTienda = wspTienda.replace(/\D/g, '');

                const mensajeWsp = `¡Hola! 👋 Vengo de *TurespuestoYa* y quiero hacer el siguiente pedido:\n\n` +
                                   `📦 *Repuesto:* ${pedidoActualData.repuesto}\n` +
                                   `💲 *Precio:* $${pedidoActualData.precio}\n` +
                                   `👤 *Cliente:* ${cliente}\n` +
                                   `📞 *Teléfono:* ${telefono}\n` +
                                   `📍 *Dirección de entrega:* ${direccion}\n\n` +
                                   `Quedo atento para coordinar el pago y la entrega. ¡Gracias!`;

                const urlWsp = wspTienda 
                    ? `https://wa.me/${wspTienda}?text=${encodeURIComponent(mensajeWsp)}`
                    : `https://wa.me/?text=${encodeURIComponent(mensajeWsp)}`;

                alert("¡Pedido registrado con éxito! Te estamos redirigiendo al WhatsApp de la tienda...");
                cerrarModalPedido();
                window.open(urlWsp, '_blank');

            }).catch((error) => {
                alert("Error al enviar el pedido: " + error.message);
            });
        });

        cargarCatalogo();
    </script>
</body>
</html>
