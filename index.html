<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurespuestoYa - Catálogo de Repuestos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Encabezado con el botón "Soy Tienda" -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl">⚙️</span>
                <h1 class="text-2xl font-black text-amber-500 tracking-wider">Turespuesto<span class="text-white">Ya</span></h1>
            </div>
            <div>
                <a href="login.html" class="bg-amber-500/10 hover:bg-amber-500 text-amber-400 hover:text-slate-950 border border-amber-500/30 font-bold px-4 py-2 rounded-xl text-xs transition flex items-center gap-1.5 shadow-sm">
                    <span>🏪</span> Soy Tienda
                </a>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-6xl mx-auto p-4 flex-grow w-full flex flex-col gap-6">

        <!-- Buscador y Filtros -->
        <section class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl flex flex-col md:flex-row gap-4 justify-between items-center mt-2">
            <div class="w-full md:w-2/3 relative">
                <input type="text" id="searchInput" placeholder="Buscar repuesto (ej. Amortiguador, Pastillas, Filtro)..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-4 pr-10 py-3.5 text-slate-100 focus:border-amber-500 focus:outline-none transition">
                <span class="absolute right-4 top-3.5 text-slate-500">🔍</span>
            </div>
            <div class="w-full md:w-1/3">
                <select id="catFilter" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3.5 text-slate-100 focus:border-amber-500 focus:outline-none transition">
                    <option value="Todas">Todas las Categorías</option>
                    <option value="Motor">Motor</option>
                    <option value="Frenos">Frenos</option>
                    <option value="Suspensión">Suspensión</option>
                    <option value="Eléctrico">Eléctrico</option>
                    <option value="Carrocería">Carrocería</option>
                    <option value="Accesorios">Accesorios</option>
                </select>
            </div>
        </section>

        <!-- Grid de Catálogo -->
        <section>
            <h2 class="text-lg font-bold text-slate-300 mb-4 flex items-center gap-2">
                📦 Repuestos Disponibles
            </h2>
            
            <div id="catalogGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <p class="text-slate-500 text-sm italic col-span-full text-center py-12">Cargando inventario disponible...</p>
            </div>
        </section>

    </main>

    <!-- Modal para Hacer Pedido -->
    <div id="modalOrder" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden justify-center items-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-md w-full flex flex-col gap-4 shadow-2xl">
            <h3 class="text-xl font-black text-amber-500">Realizar Pedido</h3>
            <p id="modalProdInfo" class="text-sm text-slate-300 bg-slate-950 p-3 rounded-xl border border-slate-800 font-medium"></p>
            
            <div class="flex flex-col gap-3">
                <div>
                    <label class="text-xs text-slate-400 font-bold mb-1 block">Tu Nombre / Contacto</label>
                    <input type="text" id="clientName" placeholder="Ej. Juan Pérez" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 focus:border-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-xs text-slate-400 font-bold mb-1 block">Teléfono de Contacto</label>
                    <input type="tel" id="clientPhone" placeholder="Ej. 0414-1234567" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 focus:border-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-xs text-slate-400 font-bold mb-1 block">Dirección de Entrega</label>
                    <input type="text" id="clientAddress" placeholder="Ej. Av. Principal, San Cristóbal" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 focus:border-amber-500 focus:outline-none">
                </div>
            </div>

            <div class="flex gap-2 mt-2">
                <button id="btnConfirmOrder" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl transition flex-1">Confirmar Pedido</button>
                <button onclick="closeModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 px-4 rounded-xl transition">Cancelar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4xzcn6XKdViHsdGnGJukyqcdAOKWtujg",
            authDomain: "turepuestoya.firebaseapp.com",
            projectId: "turepuestoya",
            databaseURL: "https://turepuestoya-default-rtdb.firebaseio.com",
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let allProducts = [];
        let selectedProduct = null;

        onValue(ref(db, 'inventarios'), (snapshot) => {
            allProducts = [];
            const data = snapshot.val();

            if (data) {
                Object.entries(data).forEach(([tiendaId, repuestosTienda]) => {
                    Object.entries(repuestosTienda).forEach(([prodId, prod]) => {
                        allProducts.push({
                            id: prodId,
                            tiendaId: tiendaId,
                            nombre: prod.nombre,
                            precio: prod.precio,
                            categoria: prod.categoria,
                            nombreTienda: prod.nombreTienda || "Tienda de Repuestos",
                            telefonoTienda: prod.telefonoTienda || "584141234567"
                        });
                    });
                });
            }

            renderCatalog(allProducts);
        });

        function renderCatalog(products) {
            const grid = document.getElementById('catalogGrid');
            grid.innerHTML = "";

            if (products.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center">
                        <p class="text-slate-400">No se encontraron repuestos disponibles.</p>
                    </div>`;
                return;
            }

            products.reverse().forEach((p) => {
                grid.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 hover:border-slate-700 p-5 rounded-2xl shadow-md flex flex-col justify-between transition group">
                        <div>
                            <div class="flex justify-between items-start gap-2 mb-2">
                                <span class="bg-slate-800 border border-slate-700 text-amber-400 text-[10px] font-bold px-2.5 py-1 rounded-lg">
                                    ${p.categoria}
                                </span>
                                <span class="text-xs text-slate-400 font-medium truncate max-w-[140px]" title="${p.nombreTienda}">
                                    🏪 ${p.nombreTienda}
                                </span>
                            </div>
                            <h3 class="text-lg font-bold text-white group-hover:text-amber-400 transition leading-snug">${p.nombre}</h3>
                        </div>

                        <div class="mt-6 flex items-center justify-between border-t border-slate-800/80 pt-4">
                            <div>
                                <span class="text-[10px] text-slate-500 uppercase font-bold block">Precio</span>
                                <span class="text-xl font-black text-emerald-400">$${p.precio}</span>
                            </div>
                            <button onclick="openOrderModal('${p.id}', '${p.tiendaId}', '${p.nombre}', ${p.precio}, '${p.telefonoTienda}')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-4 py-2.5 rounded-xl text-xs transition shadow-md">
                                Pedir Repuesto
                            </button>
                        </div>
                    </div>`;
            });
        }

        const searchInput = document.getElementById('searchInput');
        const catFilter = document.getElementById('catFilter');

        function filterProducts() {
            const query = searchInput.value.toLowerCase().trim();
            const category = catFilter.value;

            const filtered = allProducts.filter(p => {
                const matchesSearch = p.nombre.toLowerCase().includes(query) || p.nombreTienda.toLowerCase().includes(query);
                const matchesCat = category === "Todas" || p.categoria === category;
                return matchesSearch && matchesCat;
            });

            renderCatalog(filtered);
        }

        searchInput.addEventListener('input', filterProducts);
        catFilter.addEventListener('change', filterProducts);

        window.openOrderModal = function(id, tiendaId, nombre, precio, telefonoTienda) {
            selectedProduct = { id, tiendaId, nombre, precio, telefonoTienda };
            document.getElementById('modalProdInfo').innerText = `${nombre} — $${precio}`;
            document.getElementById('modalOrder').classList.remove('hidden');
            document.getElementById('modalOrder').classList.add('flex');
        };

        window.closeModal = function() {
            document.getElementById('modalOrder').classList.add('hidden');
            document.getElementById('modalOrder').classList.remove('flex');
            selectedProduct = null;
        };

        document.getElementById('btnConfirmOrder').addEventListener('click', () => {
            const cliente = document.getElementById('clientName').value.trim();
            const telefonoCliente = document.getElementById('clientPhone').value.trim();
            const direccion = document.getElementById('clientAddress').value.trim();

            if (!cliente || !telefonoCliente || !direccion) {
                return alert("Por favor llena todos los campos para enviar el pedido.");
            }

            if (!selectedProduct) {
                return alert("Error: No se seleccionó ningún producto.");
            }

            push(ref(db, `pedidos/${selectedProduct.tiendaId}`), {
                repuesto: selectedProduct.nombre,
                precio: selectedProduct.precio,
                tiendaId: selectedProduct.tiendaId,
                cliente: cliente,
                telefono: telefonoCliente,
                direccion: direccion,
                fecha: new Date().toLocaleDateString()
            })
            .then(() => {
                alert("¡Pedido enviado con éxito a la tienda!");

                // Redirigir automáticamente al WhatsApp de la tienda dueña del repuesto
                const telefonoTienda = selectedProduct.telefonoTienda;
                const textoMensaje = `¡Hola! 👋 Acabo de comprar un repuesto en TurespuestoYa:\n\n📦 *Repuesto:* ${selectedProduct.nombre}\n💵 *Precio:* $${selectedProduct.precio}\n👤 *Cliente:* ${cliente}\n📞 *Teléfono:* ${telefonoCliente}\n📍 *Dirección:* ${direccion}`;
                const urlWhatsapp = `https://wa.me/${telefonoTienda}?text=${encodeURIComponent(textoMensaje)}`;
                
                window.open(urlWhatsapp, '_blank');

                document.getElementById('clientName').value = "";
                document.getElementById('clientPhone').value = "";
                document.getElementById('clientAddress').value = "";
                closeModal();
            })
            .catch((error) => {
                alert("Error al enviar el pedido: " + error.message);
            });
        });
    </script>
</body>
</html>
